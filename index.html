<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>7-11 RIDER LOG PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        body { font-family: 'Kanit', sans-serif; background: #f1f5f9; color: #1e293b; overflow-x: hidden; }
        .btn-active:active { transform: scale(0.92); filter: brightness(0.9); }
        .glass-ui { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.5); }
        
        /* สไตล์ Custom สำหรับ SweetAlert */
        .swal2-popup { border-radius: 2rem !important; font-family: 'Kanit', sans-serif !important; }
        .swal2-styled.swal2-confirm { border-radius: 1rem !important; background-color: #2563eb !important; }
    </style>
</head>
<body class="p-2 sm:p-4">
<div id="app" class="max-w-md mx-auto pb-24">

    <div v-if="isEditing" class="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-4">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" @click="cancelEdit"></div>
        <div class="glass-ui w-full max-w-sm rounded-[2.5rem] p-6 shadow-2xl relative z-10 animate-in slide-in-from-bottom duration-300">
            <h3 class="text-lg font-bold mb-4 flex items-center gap-2"><i class="fa-solid fa-edit text-blue-600"></i> แก้ไขข้อมูล</h3>
            <div class="space-y-4">
                <div class="grid grid-cols-2 gap-2">
                    <button v-for="p in [12, 15]" @click="billForm.price = p" 
                        :class="['py-3 rounded-2xl font-bold border-2 transition-all btn-active', billForm.price === p ? 'bg-blue-600 border-blue-600 text-white shadow-lg' : 'bg-white text-slate-400 border-slate-100']">
                        ฿{{p}}
                    </button>
                </div>
                <input type="date" v-model="billForm.date" class="w-full p-4 bg-slate-100 rounded-2xl outline-none text-sm">
                <input type="number" v-model.number="billForm.count" class="w-full p-4 bg-slate-100 rounded-2xl text-xl font-bold text-center" placeholder="จำนวนบิล">
                <div class="flex gap-2">
                    <button @click="cancelEdit" class="flex-1 py-4 bg-slate-200 text-slate-600 rounded-2xl font-bold btn-active">ปิด</button>
                    <button @click="saveBill" class="flex-[2] py-4 bg-blue-600 text-white rounded-2xl font-bold shadow-lg btn-active">บันทึกใหม่</button>
                </div>
            </div>
        </div>
    </div>

    <header class="flex justify-between items-center mb-6 px-2 mt-4">
        <div>
            <h1 class="text-xl font-black text-slate-800 tracking-tight italic">RIDER<span class="text-blue-600 font-bold">LOG</span></h1>
            <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">v4.8 Mobile Optimized</p>
        </div>
        <div class="flex gap-2">
            <button @click="changeMonth(-1)" class="w-8 h-8 flex items-center justify-center bg-white rounded-xl shadow-sm text-slate-400 btn-active"><i class="fa-solid fa-chevron-left text-xs"></i></button>
            <span class="text-[10px] font-black bg-white px-3 py-2 rounded-xl shadow-sm border">{{viewMonthLabel}}</span>
            <button @click="changeMonth(1)" class="w-8 h-8 flex items-center justify-center bg-white rounded-xl shadow-sm text-slate-400 btn-active"><i class="fa-solid fa-chevron-right text-xs"></i></button>
        </div>
    </header>

    <main v-if="currentTab === 'record'" class="space-y-4">
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-slate-900 p-4 rounded-[1.8rem] text-white shadow-lg">
                <p class="text-[9px] font-bold text-slate-400 uppercase mb-1 italic">Total Bills</p>
                <h2 class="text-2xl font-black">{{monthlyStats.totalBills}}</h2>
            </div>
            <div class="bg-blue-600 p-4 rounded-[1.8rem] text-white shadow-lg">
                <p class="text-[9px] font-bold text-blue-200 uppercase mb-1 italic">Net Income</p>
                <h2 class="text-2xl font-black">฿{{monthlyStats.totalNet.toLocaleString()}}</h2>
            </div>
        </div>

        <div class="bg-white p-6 rounded-[2.2rem] shadow-sm border border-slate-100">
            <div class="flex gap-2 p-1 bg-slate-100 rounded-xl mb-6 text-[11px] font-bold">
                <button @click="subTab = 'bill'" :class="['flex-1 py-2 rounded-lg transition-all', subTab === 'bill' ? 'bg-white shadow-sm text-blue-600' : 'text-slate-400']">ค่ารอบ</button>
                <button @click="subTab = 'expense'" :class="['flex-1 py-2 rounded-lg transition-all', subTab === 'expense' ? 'bg-white shadow-sm text-rose-500' : 'text-slate-400']">รายจ่าย</button>
            </div>

            <div v-if="subTab === 'bill'" class="space-y-4">
                <div class="grid grid-cols-2 gap-2">
                    <button v-for="p in [12, 15]" @click="billForm.price = p" 
                        :class="['py-3 rounded-2xl font-bold border-2 transition-all btn-active', billForm.price === p ? 'bg-blue-600 border-blue-600 text-white' : 'bg-white text-slate-300 border-slate-100']">
                        ฿{{p}}
                    </button>
                </div>
                <div class="flex gap-2">
                    <input type="date" v-model="billForm.date" class="flex-[1.5] p-3 bg-slate-50 rounded-xl text-xs font-bold outline-none border border-slate-100">
                    <input type="number" v-model.number="billForm.count" placeholder="บิล" class="flex-1 p-3 bg-slate-50 rounded-xl text-lg font-black text-center outline-none border border-slate-100">
                </div>
                <button @click="saveBill" class="w-full py-4 bg-slate-900 text-white rounded-2xl font-bold text-sm shadow-xl btn-active">บันทึกงานวันนี้</button>
            </div>

            <div v-else class="space-y-4">
                <input type="number" v-model.number="expenseForm.amount" placeholder="ระบุจำนวนเงิน (บาท)" class="w-full p-4 bg-slate-50 rounded-2xl text-2xl font-black text-center outline-none">
                <button @click="saveExpense" class="w-full py-4 bg-rose-500 text-white rounded-2xl font-bold text-sm shadow-xl btn-active">บันทึกรายจ่าย</button>
            </div>
        </div>

        <div class="space-y-3 mt-6">
            <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] ml-2">Recent Logs</h3>
            <div v-for="(item, idx) in filteredBills" :key="idx" 
                class="bg-white flex justify-between items-center p-4 rounded-2xl shadow-sm border border-slate-50">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-blue-50 rounded-xl flex items-center justify-center text-blue-600 font-bold text-xs italic">฿{{item.price}}</div>
                    <div>
                        <p class="text-[13px] font-bold text-slate-700">{{item.date}}</p>
                        <p class="text-[10px] font-bold text-slate-400">{{item.count}} ออเดอร์</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-sm font-black text-slate-800">฿{{(item.count * (item.price || 15) * 0.97).toFixed(0)}}</span>
                    <button @click="editBill(item.originalIndex)" class="w-8 h-8 rounded-lg text-slate-300 hover:text-blue-500 transition-all btn-active flex items-center justify-center"><i class="fa-solid fa-pen text-[10px]"></i></button>
                    <button @click="deleteItem('bills', item.originalIndex)" class="w-8 h-8 rounded-lg text-slate-300 hover:text-rose-500 transition-all btn-active flex items-center justify-center"><i class="fa-solid fa-trash text-[10px]"></i></button>
                </div>
            </div>
        </div>
    </main>

    <nav class="fixed bottom-4 left-1/2 -translate-x-1/2 w-[90%] max-w-xs bg-slate-900/90 backdrop-blur px-6 py-4 rounded-[2rem] flex justify-between shadow-2xl z-40">
        <button @click="currentTab = 'record'" :class="['text-lg transition-all', currentTab === 'record' ? 'text-blue-400 scale-110' : 'text-slate-500']"><i class="fa-solid fa-home"></i></button>
        <button @click="currentTab = 'summary'" :class="['text-lg transition-all', currentTab === 'summary' ? 'text-blue-400 scale-110' : 'text-slate-500']"><i class="fa-solid fa-chart-bar"></i></button>
        <button @click="currentTab = 'settings'" :class="['text-lg transition-all', currentTab === 'settings' ? 'text-blue-400 scale-110' : 'text-slate-500']"><i class="fa-solid fa-cog"></i></button>
    </nav>
</div>

<script>
const { createApp } = Vue
createApp({
    data() {
        return {
            currentTab: 'record', subTab: 'bill', isEditing: false, editIndex: null,
            settings: { taxRate: 3 },
            viewDate: new Date(),
            billForm: { date: new Date().toISOString().substr(0, 10), count: null, price: 15 },
            expenseForm: { date: new Date().toISOString().substr(0, 10), amount: null },
            bills: [], expenses: []
        }
    },
    computed: {
        viewMonthLabel() { return this.viewDate.toLocaleDateString('th-TH', { month: 'short', year: 'numeric' }); },
        filteredBills() {
            const m = this.viewDate.getMonth(), y = this.viewDate.getFullYear();
            return this.bills.map((b, i) => ({ ...b, originalIndex: i }))
                .filter(b => { 
                    const d = new Date(b.date); 
                    return d.getMonth() === m && d.getFullYear() === y; 
                }).sort((a,b) => new Date(b.date) - new Date(a.date));
        },
        monthlyStats() {
            const b = this.filteredBills.reduce((s, i) => s + i.count, 0);
            const n = this.filteredBills.reduce((s, i) => s + (i.count * (i.price || 15) * 0.97), 0);
            return { totalBills: b, totalNet: n };
        }
    },
    methods: {
        changeMonth(s) { const d = new Date(this.viewDate); d.setMonth(d.getMonth() + s); this.viewDate = d; },
        
        saveBill() {
            if(!this.billForm.count) {
                Swal.fire({ icon: 'warning', title: 'กรุณาใส่จำนวนบิล', timer: 1500, showConfirmButton: false });
                return;
            }

            if(this.isEditing) {
                this.bills[this.editIndex] = {...this.billForm};
                this.isEditing = false;
                Swal.fire({ icon: 'success', title: 'แก้ไขเรียบร้อย', toast: true, position: 'top-end', showConfirmButton: false, timer: 2000 });
            } else {
                this.bills.unshift({...this.billForm});
                Swal.fire({ icon: 'success', title: 'บันทึกสำเร็จ', toast: true, position: 'top-end', showConfirmButton: false, timer: 2000 });
            }
            this.billForm.count = null; 
            this.save();
        },

        editBill(i) {
            this.editIndex = i;
            this.billForm = {...this.bills[i]};
            this.isEditing = true;
        },

        cancelEdit() { this.isEditing = false; },

        saveExpense() {
            if(!this.expenseForm.amount) return;
            this.expenses.unshift({...this.expenseForm});
            Swal.fire({ icon: 'error', title: 'บันทึกรายจ่ายแล้ว', toast: true, position: 'top-end', showConfirmButton: false, timer: 2000 });
            this.expenseForm.amount = null;
            this.save();
        },

        deleteItem(t, i) {
            Swal.fire({
                title: 'ลบรายการนี้?',
                text: "ลบแล้วกู้คืนไม่ได้นะ!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'ลบเลย!',
                cancelButtonText: 'ยกเลิก'
            }).then((result) => {
                if (result.isConfirmed) {
                    this[t].splice(i, 1);
                    this.save();
                    Swal.fire('ลบแล้ว!', '', 'success');
                }
            });
        },

        save() {
            localStorage.setItem('rider_v4_8_mobile', JSON.stringify({ 
                bills: this.bills, 
                expenses: this.expenses, 
                settings: this.settings 
            }));
        }
    },
    mounted() {
        const d = JSON.parse(localStorage.getItem('rider_v4_8_mobile'));
        if(d) { 
            this.bills = d.bills || []; 
            this.expenses = d.expenses || []; 
            this.settings = d.settings || { taxRate: 3 };
        }
    }
}).mount('#app')
</script>
</body>
</html>
