<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIDER LOG PRO - ADVANCED INTERACTION</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        body { font-family: 'Kanit', sans-serif; background: #f4f7fa; color: #1e293b; -webkit-tap-highlight-color: transparent; }
        
        /* สไตล์ปุ่มแบบเน้นความรู้สึก (Interactive Button) */
        .btn-rider {
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); /* สปริงเด้งๆ */
            position: relative;
            box-shadow: 0 4px 0px rgba(0,0,0,0.1);
        }
        .btn-rider:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            filter: brightness(1.1);
        }
        .btn-rider:active {
            transform: translateY(2px);
            box-shadow: 0 0px 0px rgba(0,0,0,0); /* เงาจมลงไป */
            filter: brightness(0.9);
        }

        /* เอฟเฟกต์หมุนไอคอนตอนแก้ไข */
        .edit-icon-spin:hover i {
            transform: rotate(15deg) scale(1.2);
            transition: transform 0.2s ease;
        }

        /* Glassmorphism Card */
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 1);
        }

        /* อนิเมชั่นรายการที่เพิ่มใหม่ */
        .list-enter {
            animation: slideIn 0.4s ease-out forwards;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="p-4 md:p-8">
<div id="app" class="max-w-xl mx-auto">

    <div v-if="isEditing" class="fixed inset-0 z-50 flex items-center justify-center p-6">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-md" @click="cancelEdit"></div>
        <div class="glass-panel w-full max-w-sm rounded-[3rem] p-10 shadow-2xl relative z-10 scale-up animate-in duration-300">
            <h3 class="text-2xl font-black mb-8 text-center flex flex-col items-center">
                <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mb-4">
                    <i class="fa-solid fa-pen-to-square text-2xl"></i>
                </div>
                แก้ไขข้อมูลเดิม
            </h3>
            <div class="space-y-5">
                <div class="grid grid-cols-2 gap-4">
                    <button v-for="p in [12, 15]" @click="billForm.price = p" 
                        :class="['py-4 rounded-3xl font-black text-xl btn-rider border-2', billForm.price === p ? 'bg-blue-600 border-blue-600 text-white' : 'bg-slate-50 text-slate-400 border-slate-100']">
                        ฿{{p}}
                    </button>
                </div>
                <input type="date" v-model="billForm.date" class="w-full p-5 bg-slate-50 rounded-[2rem] font-bold border-2 border-transparent focus:border-blue-500 outline-none transition-all">
                <input type="number" v-model.number="billForm.count" class="w-full p-5 bg-slate-50 rounded-[2rem] text-3xl font-black text-center border-2 border-transparent focus:border-blue-500 outline-none" placeholder="0">
                
                <div class="flex gap-3 pt-4">
                    <button @click="cancelEdit" class="flex-1 py-5 bg-slate-200 text-slate-600 rounded-3xl font-bold btn-rider">ยกเลิก</button>
                    <button @click="saveBill" class="flex-[2] py-5 bg-blue-600 text-white rounded-3xl font-bold text-lg btn-rider shadow-blue-200">
                        ยืนยันการแก้ไข <i class="fa-solid fa-check ml-2"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <header class="flex justify-between items-center mb-8 px-4">
        <div>
            <h1 class="text-3xl font-black text-slate-800 tracking-tighter">RIDER<span class="text-blue-600">LOG</span></h1>
            <div class="h-1 w-12 bg-blue-600 rounded-full"></div>
        </div>
        <div class="flex gap-3">
            <button @click="changeMonth(-1)" class="w-12 h-12 bg-white rounded-2xl flex items-center justify-center shadow-sm btn-rider"><i class="fa-solid fa-chevron-left"></i></button>
            <div class="bg-white px-6 py-3 rounded-2xl shadow-sm border font-black text-sm flex items-center">{{viewMonthLabel}}</div>
            <button @click="changeMonth(1)" class="w-12 h-12 bg-white rounded-2xl flex items-center justify-center shadow-sm btn-rider"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
    </header>

    <main v-if="currentTab === 'record'" class="space-y-8">
        
        <div class="grid grid-cols-2 gap-5">
            <div class="bg-white p-7 rounded-[3rem] shadow-xl border-b-8 border-slate-800">
                <p class="text-[11px] font-black text-slate-400 uppercase tracking-widest mb-2 text-center">ออเดอร์สะสม</p>
                <h2 class="text-4xl font-black text-center text-slate-800">{{monthlyStats.totalBills}}</h2>
            </div>
            <div class="bg-white p-7 rounded-[3rem] shadow-xl border-b-8 border-blue-600">
                <p class="text-[11px] font-black text-slate-400 uppercase tracking-widest mb-2 text-center">เงินในกระเป๋า</p>
                <h2 class="text-4xl font-black text-center text-blue-600">฿{{monthlyStats.totalNet.toLocaleString()}}</h2>
            </div>
        </div>

        <div class="glass-panel p-10 rounded-[4rem] shadow-2xl">
            <div class="flex gap-3 mb-8 bg-slate-100 p-2 rounded-[2rem]">
                <button @click="subTab = 'bill'" :class="['flex-1 py-4 rounded-[1.5rem] font-black transition-all', subTab === 'bill' ? 'bg-white text-blue-600 shadow-md scale-105' : 'text-slate-400']">ค่ารอบ</button>
                <button @click="subTab = 'expense'" :class="['flex-1 py-4 rounded-[1.5rem] font-black transition-all', subTab === 'expense' ? 'bg-white text-rose-500 shadow-md scale-105' : 'text-slate-400']">รายจ่าย</button>
            </div>

            <div v-if="subTab === 'bill'" class="space-y-6">
                <div class="grid grid-cols-2 gap-4">
                    <button v-for="p in [12, 15]" @click="billForm.price = p" 
                        :class="['py-5 rounded-3xl font-black text-2xl btn-rider border-2', billForm.price === p ? 'bg-blue-600 border-blue-600 text-white shadow-blue-200' : 'bg-white text-slate-300 border-slate-100']">
                        ฿{{p}}
                    </button>
                </div>
                <div class="flex gap-3">
                    <input type="date" v-model="billForm.date" class="flex-[1.5] p-5 bg-slate-50 rounded-[2rem] font-bold outline-none border-2 border-transparent focus:border-blue-200">
                    <input type="number" v-model.number="billForm.count" placeholder="0" class="flex-1 p-5 bg-slate-50 rounded-[2rem] text-3xl font-black text-center outline-none border-2 border-transparent focus:border-blue-200">
                </div>
                <button @click="saveBill" class="w-full py-6 bg-slate-900 text-white rounded-[2.5rem] text-xl font-black btn-rider shadow-lg shadow-slate-200 flex items-center justify-center gap-3">
                    <i class="fa-solid fa-plus-circle"></i> บันทึกงานวันนี้
                </button>
            </div>

            <div v-else class="space-y-6 text-center">
                <input type="number" v-model.number="expenseForm.amount" placeholder="0.00" class="w-full p-8 bg-slate-50 rounded-[3rem] text-5xl font-black text-center outline-none border-2 border-transparent focus:border-rose-200">
                <button @click="saveExpense" class="w-full py-6 bg-rose-500 text-white rounded-[2.5rem] text-xl font-black btn-rider shadow-lg shadow-rose-200">
                    บันทึกรายจ่าย <i class="fa-solid fa-gas-pump ml-2"></i>
                </button>
            </div>
        </div>

        <div class="space-y-4">
            <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest ml-6">Recent Activities</h3>
            <div v-for="(item, idx) in filteredBills" :key="idx" 
                class="list-enter glass-panel flex justify-between items-center p-6 rounded-[2.5rem] shadow-sm hover:shadow-lg transition-all border-l-[12px] border-blue-500">
                <div class="flex items-center gap-5">
                    <div class="w-14 h-14 bg-blue-50 rounded-2xl flex items-center justify-center text-blue-600 font-black text-lg">
                        ฿{{item.price}}
                    </div>
                    <div>
                        <p class="text-base font-black text-slate-700">{{item.date}}</p>
                        <p class="text-xs font-bold text-slate-400">{{item.count}} ออเดอร์</p>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <span class="text-xl font-black text-slate-800">฿{{(item.count * (item.price || 15) * 0.97).toFixed(0)}}</span>
                    <div class="flex gap-2">
                        <button @click="editBill(item.originalIndex)" class="w-11 h-11 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center btn-rider hover:bg-blue-600 hover:text-white">
                            <i class="fa-solid fa-pen text-xs"></i>
                        </button>
                        <button @click="deleteItem('bills', item.originalIndex)" class="w-11 h-11 rounded-full bg-rose-50 text-rose-400 flex items-center justify-center btn-rider hover:bg-rose-500 hover:text-white">
                            <i class="fa-solid fa-trash text-xs"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900 px-8 py-5 rounded-[2.5rem] flex gap-12 shadow-2xl z-40">
        <button @click="currentTab = 'record'" :class="['text-xl transition-all', currentTab === 'record' ? 'text-blue-400 scale-125' : 'text-slate-500']"><i class="fa-solid fa-house"></i></button>
        <button @click="currentTab = 'summary'" :class="['text-xl transition-all', currentTab === 'summary' ? 'text-blue-400 scale-125' : 'text-slate-500']"><i class="fa-solid fa-chart-pie"></i></button>
        <button @click="currentTab = 'settings'" :class="['text-xl transition-all', currentTab === 'settings' ? 'text-blue-400 scale-125' : 'text-slate-500']"><i class="fa-solid fa-gear"></i></button>
    </nav>
</div>

<script>
const { createApp, nextTick } = Vue
createApp({
    data() {
        return {
            currentTab: 'record', subTab: 'bill', isEditing: false, editIndex: null,
            settings: { taxRate: 3, payoutRules: [] },
            viewDate: new Date(),
            billForm: { date: new Date().toISOString().substr(0, 10), count: null, price: 15 },
            expenseForm: { date: new Date().toISOString().substr(0, 10), amount: null },
            bills: [], expenses: []
        }
    },
    computed: {
        viewMonthLabel() { return this.viewDate.toLocaleDateString('th-TH', { month: 'long', year: 'numeric' }); },
        filteredBills() {
            const m = this.viewDate.getMonth(), y = this.viewDate.getFullYear();
            return this.bills.map((b, i) => ({ ...b, originalIndex: i }))
                .filter(b => { 
                    const d = new Date(b.date); 
                    return d.getMonth() === m && d.getFullYear() === y; 
                }).sort((a,b) => new Date(b.date) - new Date(a.date));
        },
        monthlyStats() {
            const b = this.filteredBills.reduce((s, i) => s + i.count, 0);
            const n = this.filteredBills.reduce((s, i) => s + (i.count * (i.price || 15) * 0.97), 0);
            return { totalBills: b, totalNet: n };
        }
    },
    methods: {
        changeMonth(s) { const d = new Date(this.viewDate); d.setMonth(d.getMonth() + s); this.viewDate = d; },
        saveBill() {
            if(!this.billForm.count) return;
            // เพิ่มสวิทอเรทตอนบันทึกสำเร็จ
            if(this.isEditing) { this.bills[this.editIndex] = {...this.billForm}; this.isEditing = false; }
            else { this.bills.unshift({...this.billForm}); }
            this.billForm.count = null; 
            this.save();
        },
        editBill(i) { this.editIndex = i; this.billForm = {...this.bills[i]}; this.isEditing = true; },
        cancelEdit() { this.isEditing = false; },
        saveExpense() { if(!this.expenseForm.amount) return; this.expenses.unshift({...this.expenseForm}); this.expenseForm.amount = null; this.save(); },
        save() {
            localStorage.setItem('rider_v4_8_ultra', JSON.stringify({ 
                bills: this.bills, 
                expenses: this.expenses, 
                settings: this.settings 
            }));
        }
    },
    mounted() {
        const d = JSON.parse(localStorage.getItem('rider_v4_8_ultra'));
        if(d) { 
            this.bills = d.bills || []; 
            this.expenses = d.expenses || []; 
            this.settings = d.settings || { taxRate: 3, payoutRules: [] };
        }
    }
}).mount('#app')
</script>
</body>
</html>
